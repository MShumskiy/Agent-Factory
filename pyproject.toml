[project]
name = "agent-factory"
version = "0.2.0"
description = "LLM-driven simulations with actors, nature and ramification trees, runnable fully locally"
authors = [
    {name = "MS",email = "mykola_shumskiy@outlook.pt"}
]
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "openai (>=1.67.0,<3.0.0)",
    "pydantic (>=2.10.6,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)"
]

[project.scripts]
agent-factory = "agent_factory.cli:main"

[tool.poetry]
packages = [{include = "agent_factory", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
