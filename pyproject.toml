[project]
name = "janus"
version = "0.2.0"
description = "LLM-driven simulations with actors, nature and ramification trees, runnable fully locally"
authors = [
    {name = "MS",email = "mykola_shumskiy@outlook.pt"}
]
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "openai (>=1.67.0,<3.0.0)",
    "pydantic (>=2.10.6,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "fastapi (>=0.115,<1)",
    "uvicorn (>=0.34,<1)"
]

[project.scripts]
janus = "janus.cli:main"

[tool.poetry]
packages = [{include = "janus", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The shared .venv still holds v1 packages whose pytest plugins (deepeval, langsmith, dash) would
# load into these tests and can report usage; keep them out.
addopts = "-p no:plugins -p no:langsmith_plugin -p no:dash"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
